name: Frontend CI

# Lint, typecheck, and production-build the frontend. No secrets needed —
# the app talks to Coston2 only at runtime (in the browser), not at build
# time, and fonts are vendored locally (see app/fonts/) rather than fetched
# from Google at build time, so this needs no network access either.

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  build:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter frontend run lint
      - run: pnpm --filter frontend run typecheck
      - run: pnpm --filter frontend run build
