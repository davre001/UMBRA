name: Backend CI/CD

# Build/typecheck the backend on every push and PR that touches it, then —
# for pushes to main — actually trigger the Render deploy via Render's API
# and poll it to completion, failing the check (a red X on the commit) if it
# doesn't come back "live". This workflow is the deploy trigger, not just a
# status reporter: Render's own GitHub-push auto-deploy for this service
# turned out to be disconnected (confirmed by hand — every prior deploy was
# manual/API-triggered, never from a push webhook), so relying on Render to
# deploy on its own wasn't safe to assume. If that GitHub connection ever
# gets reconnected in Render's dashboard, both it and this workflow would
# trigger a deploy per push — redundant but harmless, just a wasted build.
#
# `npm test` DOES run here, but not the whole suite: a handful of tests
# submit real transactions against live Coston2 (shield deposits, compliance
# screening, a real relayed withdraw) using a funded operator key. Wiring a
# funded key into CI — reachable by every push/PR — is still a deliberate
# call not to make, so those specific tests self-skip via `it.skipIf(process.env.CI)`
# (GitHub Actions sets that automatically) rather than needing a separate
# script or file-level exclusion — see compliance.test.ts, dark-engine.test.ts,
# and relayer.test.ts for exactly which ones and why. Everything else
# (including read-only live FTSOv2 lookups, which need no secret) runs for
# real, same as `npm test` locally.

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci-cd.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci-cd.yml"

jobs:
  build:
    name: Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter umbra-backend run build
      - run: pnpm --filter umbra-backend test
        env:
          # Not a secret — derived from the real deployed vault's public
          # signet address (tb1qrmq4qvr3qmcn5s6yxlcr7y80cry0530n99g2mm), same
          # value already committed as BTC_VAULT_PUBKEY_HASH's documented
          # default throughout backend/. Needed because mempool.ts falls
          # back to a zero placeholder when this is unset, which diverges
          # from btc-deposit.test.ts's hardcoded real-address expectation —
          # caught when CI (no backend/.env, correctly gitignored) failed a
          # test that only ever passed locally.
          BTC_VAULT_PUBKEY_HASH: 1ec150307106f13a434437f03f10efc0c8fa45f3
          # CI-only dummy values, unrelated to the real secrets configured
          # on the deployed Render service — btc-deposit-routes.test.ts and
          # dark-engine-routes-gaps.test.ts only need *some* value present
          # so the app's own auth gate has something to compare the test's
          # request header against, all within the same CI process. Without
          # these, both test files fail in CI (missing entirely, or the
          # gate answering 503 "not configured" instead of 401 "missing
          # header"), which fails the build job and — since deploy needs
          # build — silently blocks every Render deploy from this workflow.
          BTC_DEPOSIT_INTERNAL_SECRET: ci-test-only-btc-deposit-secret
          MATCHER_INTERNAL_SECRET: ci-test-only-matcher-secret

  deploy:
    name: Deploy to Render
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger a Render deploy and wait for it to finish
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail

          if [ -z "${RENDER_API_KEY:-}" ] || [ -z "${RENDER_SERVICE_ID:-}" ]; then
            echo "::error::RENDER_API_KEY and/or RENDER_SERVICE_ID repo secrets are not set. See the setup notes in this workflow file (.github/workflows/backend-ci-cd.yml) for how to add them."
            exit 1
          fi

          echo "Triggering a Render deploy of commit ${{ github.sha }}..."
          TRIGGER_RESPONSE=$(curl -sf -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -d '{}')

          DEPLOY_ID=$(echo "$TRIGGER_RESPONSE" | jq -r '.id // empty')
          if [ -z "$DEPLOY_ID" ]; then
            echo "::error::Render didn't return a deploy id. Response: $TRIGGER_RESPONSE"
            exit 1
          fi
          echo "Render deploy $DEPLOY_ID started — polling every 15s for up to 15 minutes..."

          for i in $(seq 1 60); do
            DEPLOY=$(curl -sf -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$DEPLOY_ID")

            STATUS=$(echo "$DEPLOY" | jq -r '.status // empty')
            echo "Render deploy status: ${STATUS:-unknown}"

            case "$STATUS" in
              live)
                echo "Deploy succeeded."
                exit 0
                ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "::error::Render deploy $DEPLOY_ID ended with status: $STATUS"
                exit 1
                ;;
              # created / queued / build_in_progress / pre_deploy_in_progress
              # / update_in_progress — still running, keep polling.
            esac

            sleep 15
          done

          echo "::error::Timed out after ~15 minutes waiting for Render deploy $DEPLOY_ID to finish"
          exit 1

# --- One-time setup ---
#
# This workflow needs two GitHub repo secrets (Settings -> Secrets and
# variables -> Actions -> New repository secret):
#
#   RENDER_API_KEY    Render dashboard -> Account Settings -> API Keys -> Create API Key
#   RENDER_SERVICE_ID Render dashboard -> the umbra-backend service -> its URL/settings
#                      page shows an id starting with "srv-"
#
# Until both are set, the "Deploy to Render" job will fail with a clear
# error rather than silently doing nothing — the build job still runs and
# gates every push/PR regardless.
