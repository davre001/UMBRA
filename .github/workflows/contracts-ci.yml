name: Contracts CI

# Compiles and tests the Solidity contracts + generated verifiers against a
# local, ephemeral Hardhat network — not live Coston2. No secrets needed:
# hardhat.test.ts's real Noir/UltraHonk proof tests use committed fixtures
# (contract/circuits/noir/*/fixtures/) rather than proving anything fresh,
# so this needs no proving toolchain either, just the compiled contracts.

on:
  push:
    branches: [main]
    paths:
      - "contract/**"
      - ".github/workflows/contracts-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "contract/**"
      - ".github/workflows/contracts-ci.yml"

jobs:
  test:
    name: Compile & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter umbra-contracts run compile
      - run: pnpm --filter umbra-contracts test
